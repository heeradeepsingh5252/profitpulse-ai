services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-profitpulse}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-profitpulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - profitpulse_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DEMO_ORGANIZATION_ID: ${DEMO_ORGANIZATION_ID:-11111111-1111-4111-8111-111111111111}
      APP_ENV: local
      CHROMA_PATH: /app/data/chroma
      RAG_MAX_UPLOAD_BYTES: 10485760
    volumes:
      - profitpulse_chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build:
      context: ./backend
    command: ["python", "-m", "profitpulse.mcp_server"]
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_API_BASE_URL: http://api:8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      DEMO_ORGANIZATION_ID: ${DEMO_ORGANIZATION_ID:-11111111-1111-4111-8111-111111111111}
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

volumes:
  profitpulse_postgres_data:
  profitpulse_chroma_data:
